<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050b14">

<title>Rii AI V3.5.2</title>

<style>
:root{
  --bg:#050b14;
  --panel:#0a1625f2;
  --line:#be96465c;
  --gold:#d8ad58;
  --gold2:#f2d58b;
  --mint:#58d9b0;
  --blue:#3fa7da;
  --red:#ff7d7d;
  --text:#f7f4ea;
  --muted:#9aabbd;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

button,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.background{
  position:fixed;
  inset:0;
  z-index:-2;

  background:
    radial-gradient(
      circle at 82% 18%,
      #daad582b,
      transparent 27%
    ),

    radial-gradient(
      circle at 16% 72%,
      #1f5f9e42,
      transparent 32%
    ),

    linear-gradient(
      145deg,
      #02070d,
      #071522 48%,
      #020811
    );
}

.app{
  width:min(100%,980px);

  margin:auto;

  min-height:100vh;

  padding:
    calc(18px + env(safe-area-inset-top))
    14px
    calc(110px + env(safe-area-inset-bottom));
}

.header{
  display:flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  gap:12px;

  margin-bottom:
    18px;
}

.logo{
  font-size:
    30px;

  font-weight:
    900;

  color:
    var(--gold2);
}

.logo span{
  color:#fff;
}

.tagline{
  margin-top:
    4px;

  color:
    var(--muted);

  font-size:
    12px;
}

.header-actions{
  display:flex;

  gap:6px;
}

.icon-btn,
.ready{
  height:
    43px;

  border-radius:
    14px;

  border:
    1px solid var(--line);

  background:
    #08131fe0;

  color:#fff;
}

.icon-btn{
  width:
    43px;
}

.ready{
  display:flex;

  align-items:
    center;

  gap:
    6px;

  padding:
    0 10px;

  color:
    var(--gold2);

  font-size:
    11px;

  font-weight:
    800;
}

.dot{
  width:
    7px;

  height:
    7px;

  border-radius:
    50%;

  background:
    var(--mint);
}

.hero,
.card{
  border:
    1px solid #ffffff14;

  background:
    var(--panel);

  border-radius:
    28px;

  box-shadow:
    0 18px 50px #00000047;
}

.hero{
  padding:
    22px;

  border-color:
    #dab05661;
}

.eyebrow{
  color:
    var(--gold2);

  font-size:
    12px;

  font-weight:
    850;

  letter-spacing:
    1px;
}

.hero h1{
  margin:
    9px 0 12px;

  font-size:
    clamp(
      30px,
      7vw,
      50px
    );

  line-height:
    1.04;

  letter-spacing:
    -1.4px;
}

.hero p{
  margin:0;

  color:
    var(--muted);

  line-height:
    1.6;
}

.identity{
  display:flex;

  justify-content:
    space-between;

  gap:
    10px;

  margin-top:
    16px;

  padding:
    12px 13px;

  border-radius:
    17px;

  background:
    #00000038;
}

.id-small{
  color:
    var(--muted);

  font-size:
    10px;

  line-height:
    1.45;
}

.id-value{
  margin-top:
    3px;

  color:
    var(--gold2);

  font-weight:
    850;
}

.robot-pill{
  align-self:
    center;

  padding:
    8px 10px;

  border-radius:
    999px;

  background:
    #ffffff0d;

  color:
    #7f91a4;

  font-size:
    10px;
}

.voicebar{
  display:grid;

  grid-template-columns:
    1fr auto auto;

  gap:
    7px;

  margin:
    16px 0;
}

.voicebar select,
.voicebar button{
  border-radius:
    15px;

  border:
    1px solid var(--line);

  background:
    #07131f;

  color:#fff;
}

.voicebar select{
  min-width:0;

  padding:
    12px;
}

.voicebar button{
  padding:
    0 13px;
}

.section-head{
  display:flex;

  justify-content:
    space-between;

  align-items:
    end;

  margin:
    22px 3px 11px;
}

.section-head h2{
  margin:0;

  font-size:
    20px;
}

.section-head span{
  color:
    var(--muted);

  font-size:
    11px;
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:
    10px;
}

.center{
  position:
    relative;

  min-height:
    180px;

  overflow:
    hidden;

  padding:
    16px;

  border-radius:
    25px;

  border:
    1px solid #ffffff14;
}

.center.math{
  background:
    linear-gradient(
      145deg,
      #103b60,
      #071d32
    );
}

.center.camera{
  background:
    linear-gradient(
      145deg,
      #654a1c,
      #241a0b
    );

  border-color:
    #e2b4517a;
}

.center.translate{
  background:
    linear-gradient(
      145deg,
      #075148,
      #06272a
    );
}

.center.notes{
  background:
    linear-gradient(
      145deg,
      #493174,
      #211b42
    );
}

.center-icon{
  width:
    54px;

  height:
    54px;

  display:grid;

  place-items:
    center;

  border-radius:
    17px;

  background:
    #0000003b;

  font-size:
    28px;
}

.center h3{
  margin:
    15px 0 6px;

  font-size:
    18px;
}

.center p{
  margin:
    0 0 42px;

  color:
    #eef3f8b8;

  font-size:
    11px;

  line-height:
    1.48;
}

.center-open{
  position:
    absolute;

  right:
    13px;

  bottom:
    13px;

  width:
    36px;

  height:
    36px;

  border:
    0;

  border-radius:
    50%;

  background:
    #0000003d;

  color:#fff;
}

.card{
  margin-top:
    16px;

  padding:
    17px;
}

.audio-card select{
  width:
    100%;

  margin-top:
    9px;

  padding:
    12px;

  border-radius:
    15px;

  border:
    1px solid var(--line);

  background:
    #07131f;

  color:#fff;
}

.screen{
  position:
    fixed;

  inset:
    0;

  z-index:
    800;

  display:
    none;

  overflow:
    auto;

  padding:
    calc(15px + env(safe-area-inset-top))
    13px
    calc(95px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      145deg,
      #030912,
      #071522
    );
}

.screen.open{
  display:block;
}

.screen-inner{
  width:
    min(100%,760px);

  margin:auto;
}

.screen-top{
  display:flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    8px;
}

.back{
  padding:
    10px 13px;

  border-radius:
    14px;

  border:
    1px solid #ffffff14;

  background:
    #ffffff0e;

  color:#fff;

  font-weight:
    800;
}

.screen-title{
  font-weight:
    900;
}

.screen-card{
  margin-top:
    14px;

  padding:
    18px;

  border-radius:
    26px;

  border:
    1px solid var(--line);

  background:
    var(--panel);
}

.textbox{
  width:
    100%;

  min-height:
    110px;

  margin-top:
    10px;

  padding:
    13px;

  border-radius:
    16px;

  border:
    1px solid #ffffff17;

  background:
    #06111c;

  color:#fff;

  resize:
    vertical;
}

.action-row{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:
    8px;

  margin-top:
    10px;
}

.action{
  padding:
    13px;

  border-radius:
    15px;

  border:
    1px solid var(--line);

  background:
    #0c1c2c;

  color:#fff;

  font-weight:
    800;
}

.action.gold{
  background:
    #5e461b;

  color:
    #fff0c5;
}

.action.mint{
  background:
    #0d453d;
}

.action.blue{
  background:
    #103957;
}

.result{
  margin-top:
    12px;

  padding:
    14px;

  border-radius:
    17px;

  border:
    1px solid #ffffff14;

  background:
    #06111b;

  color:
    #dbe7f1;

  line-height:
    1.6;

  white-space:
    pre-wrap;
}

.math-card,
.vision-card{
  display:none;

  margin-top:
    14px;

  padding:
    16px;

  border-radius:
    21px;

  background:
    linear-gradient(
      145deg,
      #112232,
      #07121d
    );
}

.math-card{
  border:
    1px solid #3fa7da55;
}

.vision-card{
  border:
    1px solid #d8ad584d;
}

.math-card.show,
.vision-card.show{
  display:block;
}

.math-answer,
.vision-name{
  font-size:
    28px;

  font-weight:
    900;

  color:
    var(--gold2);

  margin-bottom:
    10px;
}

.math-steps{
  display:grid;

  gap:
    8px;
}

.math-step{
  padding:
    11px;

  border-radius:
    14px;

  background:
    #ffffff0b;

  line-height:
    1.5;
}

.math-meta,
.vision-core{
  margin-top:
    10px;

  color:
    var(--muted);

  font-size:
    11px;
}

.math-status,
.ai-message{
  display:none;

  margin-top:
    12px;

  padding:
    14px;

  border-radius:
    16px;

  background:
    #0a362f;

  border:
    1px solid #58d9b044;
}

.math-status.show,
.ai-message.show{
  display:block;
}

.math-status.error,
.ai-message.error{
  background:
    #50191f73;

  border-color:
    #ff7d7d52;

  color:
    #ffd6d6;
}

.ai-message.resting{
  border-color:
    #ffc56d57;

  background:
    #583b0d70;

  color:
    #ffe9b8;
}

.camera-wrap{
  position:
    relative;

  overflow:
    hidden;

  max-height:
    66vh;

  aspect-ratio:
    3/4;

  border-radius:
    24px;

  border:
    1px solid #e2b4516b;

  background:
    #02060b;
}

.camera-wrap video,
.camera-wrap canvas,
.camera-wrap img{
  width:
    100%;

  height:
    100%;

  display:
    block;

  object-fit:
    cover;
}

.camera-overlay{
  position:
    absolute;

  inset:
    10%;

  border:
    2px solid #f2d58bd9;

  border-radius:
    20px;

  pointer-events:
    none;
}

.camera-status{
  margin-top:
    10px;

  color:
    var(--muted);

  font-size:
    12px;
}

.explanation{
  margin-top:
    15px;

  line-height:
    1.65;
}

.info-grid{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:
    8px;

  margin-top:
    13px;
}

.info-box{
  padding:
    11px;

  border-radius:
    15px;

  background:
    #ffffff0a;
}

.info-label{
  margin-bottom:
    4px;

  color:
    #7f94a8;

  font-size:
    10px;
}

.fact-list{
  display:grid;

  gap:
    7px;

  margin-top:
    13px;
}

.fact{
  padding:
    10px 11px;

  border-radius:
    14px;

  background:
    #d8ad580f;

  font-size:
    12px;

  line-height:
    1.45;
}

.root-debug{
  margin-top:
    14px;

  padding:
    12px;

  border-radius:
    16px;

  border:
    1px dashed #d8ad5847;

  background:
    #00000029;
}

.root-debug summary{
  color:
    #b89b62;

  font-size:
    11px;

  font-weight:
    800;
}

.root-debug pre{
  white-space:
    pre-wrap;

  color:
    #9dafc0;

  font-size:
    11px;

  overflow:
    auto;
}

.rii{
  position:
    fixed;

  left:
    calc(100vw - 82px);

  top:
    calc(100vh - 148px);

  z-index:
    999;

  width:
    62px;

  height:
    62px;

  display:grid;

  place-items:
    center;

  border-radius:
    50%;

  border:
    2px solid var(--gold);

  background:
    radial-gradient(
      circle at 35% 30%,
      #28517c,
      #06121e 62%
    );

  color:
    var(--gold2);

  font-weight:
    900;

  touch-action:
    none;

  user-select:
    none;

  box-shadow:
    0 9px 28px #0000008c,
    0 0 0 5px #0a1726b8;
}

.overlay{
  position:
    fixed;

  inset:
    0;

  z-index:
    900;

  display:
    none;

  align-items:
    center;

  justify-content:
    center;

  padding:
    20px;

  background:
    #01060bc2;

  backdrop-filter:
    blur(16px);
}

.overlay.open{
  display:flex;
}

.panel{
  width:
    min(94vw,430px);

  max-height:
    85vh;

  overflow:
    auto;

  padding:
    20px;

  border-radius:
    29px;

  border:
    1px solid var(--line);

  background:
    linear-gradient(
      155deg,
      #0e1d2ffc,
      #040c15fc
    );
}

.panel-head{
  display:flex;

  justify-content:
    space-between;

  align-items:
    center;
}

.close{
  width:
    38px;

  height:
    38px;

  border:
    0;

  border-radius:
    50%;

  background:
    #ffffff12;

  color:#fff;
}

.lang-list,
.quick-grid{
  display:grid;

  gap:
    8px;

  margin-top:
    14px;
}

.quick-grid{
  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );
}

.lang-btn,
.quick{
  padding:
    12px;

  border-radius:
    16px;

  border:
    1px solid #ffffff12;

  background:
    #ffffff0a;

  color:#fff;

  text-align:
    left;
}

.lang-btn.active{
  border-color:
    #d8ad58a6;

  background:
    #d8ad581c;
}

.quick{
  min-height:
    84px;

  font-weight:
    800;
}

.quick span{
  display:block;

  margin-bottom:
    5px;

  font-size:
    24px;
}

.hidden{
  display:none!important;
}

.boot-error{
  margin-top:14px;
  padding:14px;
  border-radius:16px;
  border:1px solid #ff7d7d55;
  background:#521820a8;
  color:#ffd9d9;
  line-height:1.5;
  display:none;
}

.boot-error.show{
  display:block;
}

@media(max-width:430px){

  .hero{
    padding:20px;
  }

  .grid{
    gap:8px;
  }

  .center{
    min-height:176px;
    padding:14px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="app">

<header class="header">

  <div>

    <div class="logo">
      Rii <span>AI</span>
    </div>

    <div
      id="tagline"
      class="tagline"
    ></div>

  </div>


  <div class="header-actions">

    <button
      class="icon-btn"
      onclick="speakHome()"
    >
      🔊
    </button>

    <button
      class="icon-btn"
      onclick="listenCommand()"
    >
      🎙
    </button>

    <button
      class="icon-btn"
      onclick="openLanguage()"
    >
      🌐
    </button>

    <div class="ready">

      <span class="dot"></span>

      <span id="readyText"></span>

    </div>

  </div>

</header>


<section class="hero">

  <div class="eyebrow">
    RII V3.5.2 • LANGUAGE BOOT FIX
  </div>

  <h1 id="heroTitle"></h1>

  <p id="heroText"></p>


  <div class="identity">

    <div>

      <div class="id-small">
        Rii Identity
      </div>

      <div class="id-value">
        Rii00000001
      </div>

      <div
        id="rootText"
        class="id-small"
      ></div>

    </div>


    <div
      id="robotFuture"
      class="robot-pill"
    ></div>

  </div>


  <div
    id="bootError"
    class="boot-error"
  ></div>

</section>


<div class="voicebar">

  <select
    id="homeLanguage"
    onchange="setLanguage(this.value)"
  ></select>

  <button onclick="listenCommand()">
    🎙
  </button>

  <button onclick="speakHome()">
    🔊
  </button>

</div>


<div class="section-head">

  <h2 id="centerTitle"></h2>

  <span id="centerHint"></span>

</div>


<section class="grid">

  <article class="center math">

    <div class="center-icon">
      🧮
    </div>

    <h3 id="mathTitle"></h3>

    <p id="mathText"></p>

    <button
      class="center-open"
      onclick="openCenter('math')"
    >
      ›
    </button>

  </article>


  <article class="center camera">

    <div class="center-icon">
      📷
    </div>

    <h3 id="cameraTitle"></h3>

    <p id="cameraText"></p>

    <button
      class="center-open"
      onclick="openCenter('camera')"
    >
      ›
    </button>

  </article>


  <article class="center translate">

    <div class="center-icon">
      🌍
    </div>

    <h3 id="translateTitle"></h3>

    <p id="translateText"></p>

    <button
      class="center-open"
      onclick="openCenter('translate')"
    >
      ›
    </button>

  </article>


  <article class="center notes">

    <div class="center-icon">
      📝
    </div>

    <h3 id="notesTitle"></h3>

    <p id="notesText"></p>

    <button
      class="center-open"
      onclick="openCenter('notes')"
    >
      ›
    </button>

  </article>

</section>


<section class="card audio-card">

  <strong id="audioTitle"></strong>

  <select
    id="audioRoute"
    disabled
  >

    <option id="audioSystemOption"></option>

  </select>


  <div
    id="audioNote"
    class="id-small"
  ></div>

</section>

</div>


<div
  id="riiButton"
  class="rii"
>
  Rii
</div>


<!-- LANGUAGE -->

<div
  id="languageOverlay"
  class="overlay"
>

  <div class="panel">

    <div class="panel-head">

      <h3 id="languagePanelTitle"></h3>

      <button
        class="close"
        onclick="closeLanguage()"
      >
        ×
      </button>

    </div>

    <div
      id="languageList"
      class="lang-list"
    ></div>

  </div>

</div>


<!-- QUICK -->

<div
  id="quickOverlay"
  class="overlay"
>

  <div class="panel">

    <div class="panel-head">

      <h3>
        Rii
      </h3>

      <button
        class="close"
        onclick="closeQuick()"
      >
        ×
      </button>

    </div>


    <div class="quick-grid">

      <button
        class="quick"
        onclick="quickOpen('math')"
      >

        <span>🧮</span>

        <b id="quickMath"></b>

      </button>


      <button
        class="quick"
        onclick="quickOpen('camera')"
      >

        <span>📷</span>

        <b id="quickCamera"></b>

      </button>


      <button
        class="quick"
        onclick="quickOpen('translate')"
      >

        <span>🌍</span>

        <b id="quickTranslate"></b>

      </button>


      <button
        class="quick"
        onclick="quickOpen('notes')"
      >

        <span>📝</span>

        <b id="quickNotes"></b>

      </button>


      <button
        class="quick"
        onclick="closeQuick()"
      >

        <span>🏠</span>

        <b id="quickHome"></b>

      </button>


      <button
        class="quick"
        onclick="openLanguageFromQuick()"
      >

        <span>🌐</span>

        <b id="quickLanguage"></b>

      </button>

    </div>

  </div>

</div>


<!-- CENTER -->

<div
  id="centerScreen"
  class="screen"
>

  <div class="screen-inner">

/* =====================================================
   HELPERS
===================================================== */

function el(
  id
){

  return document.getElementById(
    id
  );
}


function setText(
  id,
  value
){

  const node =
    el(
      id
    );


  if(
    node
  ){

    node.textContent =
      value;
  }
}


function currentLanguage(){

  const code =
    localStorage.getItem(
      LANGUAGE_KEY
    )
    ||
    "vi";


  return (
    languages.find(
      item =>
        item.code ===
        code
    )
    ||
    languages[0]
  );
}


function text(){

  const code =
    currentLanguage()
      .code;


  return (
    UI[code]
    ||
    EN
  );
}


function escapeHtml(
  value
){

  return String(
    value ??
    ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


/* =====================================================
   BOOT VALIDATION
===================================================== */

function validateBoot(){

  const requiredIds = [

    "tagline",
    "readyText",
    "heroTitle",
    "heroText",
    "rootText",
    "centerTitle",
    "mathTitle",
    "cameraTitle",
    "translateTitle",
    "notesTitle",
    "homeLanguage",
    "centerLanguage",
    "mathInput",
    "cameraVideo",
    "cameraCanvas",
    "capturedImage",
    "cameraQuestion",
    "translateInput",
    "notesInput",
    "riiButton"

  ];


  const missing =
    requiredIds.filter(
      id =>
        !el(id)
    );


  if(
    missing.length
  ){

    throw new Error(
      "Missing DOM IDs: "
      +
      missing.join(", ")
    );
  }


  const requiredLanguages =
    languages.map(
      item =>
        item.code
    );


  const missingLanguages =
    requiredLanguages.filter(
      code =>
        !UI[code]
    );


  if(
    missingLanguages.length
  ){

    throw new Error(
      "Missing UI languages: "
      +
      missingLanguages.join(", ")
    );
  }


  return true;
}


function showBootError(
  error
){

  const node =
    el(
      "bootError"
    );


  if(
    !node
  ){

    return;
  }


  node.textContent =
    "❌ Rii UI boot error: "
    +
    String(
      error?.message ||
      error
    );


  node
    .classList
    .add(
      "show"
    );
}

  document

  if(

    renderVision(
      latestVisionResult
    );
  }

};

function speak(
  value
){

  const message =
    String(
      value ||
      ""
    )
      .trim();


  if(
    !message
    ||
    !(
      "speechSynthesis"
      in window
    )
  ){

    return;
  }


  const utterance =
    new SpeechSynthesisUtterance(
      message
    );


  utterance.lang =
    currentLanguage()
      .locale;


  utterance.rate =
    .9;


  speechSynthesis.cancel();


  speechSynthesis.speak(
    utterance
  );
}

/* =====================================================
   SPEECH INPUT
===================================================== */

function recognitionClass(){

  return (
    window.SpeechRecognition
    ||
    window.webkitSpeechRecognition
  );
}


function startRecognition(
  targetId =
  null
){

  const C =
    recognitionClass();


  if(
    !C
  ){

    alert(
      "Speech recognition is not supported."
    );

    return;
  }


  if(
    recognition
  ){

    try{

      recognition.stop();

    }catch{}
  }


  recognition =
    new C();


  recognition.lang =
    currentLanguage()
      .locale;


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.onresult =
    event => {

      const words =
        event
          .results[0][0]
          .transcript;


      if(
        targetId
      ){

        const target =
          el(
            targetId
          );


        if(
          target
        ){

          target.value =
            words;
        }

      }else{

        handleVoiceCommand(
          words
        );
      }
    };


  recognition.start();
}


window.listenCommand =
function(){

  startRecognition();
};


window.speechInto =
function(
  targetId
){

  startRecognition(
    targetId
  );
};


function handleVoiceCommand(
  value
){

  const query =
    String(
      value ||
      ""
    )
      .toLowerCase();


  if(
    /camera|máy ảnh|カメラ|相机|카메라|cámara|caméra|kamera|fotocamera|กล้อง/
      .test(
        query
      )
  ){

    openCenter(
      "camera"
    );

    return;
  }


  if(
    /math|toán|数学|算数|수학|matemáticas|maths|mathe|matematica|คณิต|matematika/
      .test(
        query
      )
  ){

    openCenter(
      "math"
    );

    return;
  }


  if(
    /translate|language|dịch|ngôn ngữ|语言|言語|언어|idioma|langue|sprache|lingua|ภาษา|bahasa/
      .test(
        query
      )
  ){

    openCenter(
      "translate"
    );

    return;
  }


  if(
    /note|alarm|ghi chú|báo thức|メモ|알람|nota|alarma|notiz|โน้ต|catatan/
      .test(
        query
      )
  ){

    openCenter(
      "notes"
    );

    return;
  }


  speak(
    value
  );
}

window.solveMathNow =
async function(){

  if(
    mathBusy
  ){

    return;
  }


  const problem =
    el(
      "mathInput"
    )
      .value
      .trim();


  const x =
    text();


  if(
    !problem
  ){

    showMathStatus(
      x.needProblem,
      true
    );

    return;
  }


  if(
    !window.RiiWorkerClientV2
    ||
    typeof window
      .RiiWorkerClientV2
      .solveMath !==
      "function"
  ){

    showMathStatus(
      x.mathClientMissing,
      true
    );

    return;
  }


  setMathBusy(
    true
  );


  hideMathStatus();


  el(
    "mathCard"
  )
    .classList
    .remove(
      "show"
    );


  el(
    "mathDebug"
  )
    .classList
    .add(
      "hidden"
    );


  try{

    const language =
      currentLanguage();


    const result =
      await window
        .RiiWorkerClientV2
        .solveMath(

          problem,

          {
            targetLanguage:
              language.code,

            targetLanguageName:
              language.english
          }
        );


    latestMathResult =
      result;


    renderMath(
      result
    );


    showMathStatus(

      result.aiUsed
        ?
        x.mathAI
        :
        x.mathLocal
    );


    speakMath();


  }catch(error){

    const formatted =
      window
        .RiiWorkerClientV2
        ?.formatError
      ?
      window
        .RiiWorkerClientV2
        .formatError(
          error
        )
      :
      {
        message:
          String(
            error?.message ||
            error
          ),

        code:
          "CLIENT_ERROR"
      };


    el(
      "mathDebugText"
    )
      .textContent =
      JSON.stringify(
        formatted,
        null,
        2
      );


    el(
      "mathDebug"
    )
      .classList
      .remove(
        "hidden"
      );


    const quota =
      formatted.code ===
      "MATH_MODEL_FAILED"

      &&
      /4006|daily free allocation|10,000 neurons/i
        .test(
          formatted.message
        );


    showMathStatus(

      quota
        ?
        x.mathQuota
        :
        x.mathError
        +
        formatted.message,

      true
    );


  }finally{

    setMathBusy(
      false
    );
  }
};

function isCameraLive(){

  const video =
    el(
      "cameraVideo"
    );


  return Boolean(

    cameraStream

    &&
    video

    &&
    video.readyState >=
      2

    &&
    video.videoWidth >
      0

    &&
    video.videoHeight >
      0
  );
}


function hasCapturedFrame(){

  const canvas =
    el(
      "cameraCanvas"
    );


  return Boolean(

    capturedFrameReady

    &&
    canvas.width >
      0

    &&
    canvas.height >
      0
  );
}


window.startCamera =
async function(){

  try{

    stopCamera();


    capturedFrameReady =
      false;


    latestVisionResult =
      null;


    hideAiMessage();


    el(
      "visionCard"
    )
      .classList
      .remove(
        "show"
      );


    el(
      "visionRetryButton"
    )
      .classList
      .add(
        "hidden"
      );


    el(
      "visionSpeakButton"
    )
      .disabled =
      true;


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:
                "environment"
            }
          },

          audio:
            false
        });


    const video =
      el(
        "cameraVideo"
      );


    video.srcObject =
      cameraStream;


    video
      .classList
      .remove(
        "hidden"
      );


    el(
      "capturedImage"
    )
      .classList
      .add(
        "hidden"
      );


    await video.play();


    setText(
      "cameraStatus",
      text().cameraLive
    );


  }catch(error){

    setText(
      "cameraStatus",

      "❌ "
      +
      String(
        error?.message ||
        error
      )
    );
  }
};


function captureFrame(){

  if(
    !isCameraLive()
  ){

    throw new Error(
      "Camera not ready."
    );
  }


  const video =
    el(
      "cameraVideo"
    );


  const canvas =
    el(
      "cameraCanvas"
    );


  const scale =
    Math.min(

      1,

      1280 /
      Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );


  const width =
    Math.round(
      video.videoWidth *
      scale
    );


  const height =
    Math.round(
      video.videoHeight *
      scale
    );


  canvas.width =
    width;


  canvas.height =
    height;


  canvas
    .getContext(
      "2d"
    )
    .drawImage(
      video,
      0,
      0,
      width,
      height
    );


  capturedFrameReady =
    true;


  const image =
    el(
      "capturedImage"
    );


  image.src =
    canvas.toDataURL(
      "image/jpeg",
      .82
    );


  image
    .classList
    .remove(
      "hidden"
    );


  video
    .classList
    .add(
      "hidden"
    );


  setText(
    "cameraStatus",
    text().cameraSaved
  );


  stopCamera();
}


window.captureAndAnalyze =
async function(){

  if(
    visionBusy
  ){

    return;
  }


  try{

    if(
      isCameraLive()
    ){

      captureFrame();
    }


    if(
      !hasCapturedFrame()
    ){

      throw new Error(
        "No captured frame."
      );
    }


    await analyzeCapturedImage();


  }catch(error){

    handleVisionError(
      error
    );
  }
};


window.analyzeCapturedImage =
async function(){

  if(
    visionBusy
    ||
    !hasCapturedFrame()
  ){

    return;
  }


  if(
    !window.RiiWorkerClientV2
    ||
    typeof window
      .RiiWorkerClientV2
      .analyzeImage !==
      "function"
  ){

    handleVisionError(
      new Error(
        "Vision client not ready."
      )
    );

    return;
  }


  visionBusy =
    true;


  el(
    "captureButton"
  )
    .disabled =
    true;


  setText(
    "captureButton",
    text().looking
  );


  el(
    "visionRetryButton"
  )
    .classList
    .add(
      "hidden"
    );


  showAiMessage(
    "⏳",
    text().looking,
    false
  );


  try{

    const language =
      currentLanguage();


    const question =
      el(
        "cameraQuestion"
      )
        .value
        .trim();


    const result =
      await window
        .RiiWorkerClientV2
        .analyzeImage(

          el(
            "cameraCanvas"
          ),

          {
            question,

            targetLanguage:
              language.code,

            targetLanguageName:
              language.english
          }
        );


    latestVisionResult =
      result;


    renderVision(
      result
    );


    hideAiMessage();


    el(
      "rootDebug"
    )
      .classList
      .add(
        "hidden"
      );


    speakVision();


  }catch(error){

    handleVisionError(
      error
    );


  }finally{

    visionBusy =
      false;


    el(
      "captureButton"
    )
      .disabled =
      false;


    setText(
      "captureButton",
      text().capture
    );
  }
};


function handleVisionError(
  error
){

  const formatted =
    window
      .RiiWorkerClientV2
      ?.formatError
    ?
    window
      .RiiWorkerClientV2
      .formatError(
        error
      )
    :
    {
      message:
        String(
          error?.message ||
          error
        ),

      code:
        "CLIENT_ERROR"
    };


  el(
    "rootDebugText"
  )
    .textContent =
    JSON.stringify(
      formatted,
      null,
      2
    );


  el(
    "rootDebug"
  )
    .classList
    .remove(
      "hidden"
    );


  const quota =
    formatted.code ===
    "VISION_MODEL_FAILED"

    &&
    /4006|daily free allocation|10,000 neurons/i
      .test(
        formatted.message
      );


  showAiMessage(

    quota
      ?
      text().visionRest
      :
      text().visionError,

    quota
      ?
      text().visionRestText
      :
      text().visionErrorText,

    !quota
  );


  /*
    IMPORTANT V3.5.2
    Retry visible after failure.
  */

  if(
    hasCapturedFrame()
  ){

    el(
      "visionRetryButton"
    )
      .classList
      .remove(
        "hidden"
      );
  }


  setText(
    "cameraStatus",
    text().cameraSaved
  );
}

function renderVision(
  result
){

  setText(
    "visionName",

    result.displayName
    ||
    result.objectName
    ||
    "Unknown"
  );


  setText(
    "visionCore",

    [
      result.category,
      result.objectName
    ]
      .filter(
        Boolean
      )
      .join(
        " • "
      )
  );


  setText(
    "visionExplanation",

    result.childExplanation
    ||
    result.closerViewMessage
    ||
    ""
  );


  const x =
    text();


  const items =
    [];


  if(
    result.color
  ){

    items.push([
      x.color,
      result.color
    ]);
  }


  if(
    result.habitat
  ){

    items.push([
      x.habitat,
      result.habitat
    ]);
  }


  if(
    result.origin
  ){

    items.push([
      x.origin,
      result.origin
    ]);
  }


  if(
    result.uses
  ){

    items.push([
      x.uses,
      result.uses
    ]);
  }


  if(
    result.detectedText
  ){

    items.push([
      x.detectedText,
      result.detectedText
    ]);
  }


  if(
    Array.isArray(
      result.visibleFeatures
    )
    &&
    result.visibleFeatures.length
  ){

    items.push([

      x.features,

      result
        .visibleFeatures
        .join(
          ", "
        )
    ]);
  }


  el(
    "visionInfoGrid"
  )
    .innerHTML =

    items
      .map(
        item =>
          `
          <div class="info-box">

            <div class="info-label">
              ${escapeHtml(item[0])}
            </div>

            <div>
              ${escapeHtml(item[1])}
            </div>

          </div>
          `
      )
      .join("");


  el(
    "visionFacts"
  )
    .innerHTML =

    (
      Array.isArray(
        result.interestingFacts
      )
        ?
        result.interestingFacts
        :
        []
    )
      .map(
        fact =>
          `
          <div class="fact">
            ✨ ${escapeHtml(fact)}
          </div>
          `
      )
      .join("");


  const answer =
    el(
      "visionAnswer"
    );


  if(
    result.answer
  ){

    answer.textContent =
      result.answer;


    answer
      .classList
      .remove(
        "hidden"
      );

  }else{

    answer
      .classList
      .add(
        "hidden"
      );
  }


  el(
    "visionCard"
  )
    .classList
    .add(
      "show"
    );


  el(
    "visionSpeakButton"
  )
    .disabled =
    false;


  el(
    "visionRetryButton"
  )
    .classList
    .add(
      "hidden"
    );
}

function(){

  if(

      "notesInput"
    )
      .value
      .trim();


  if(
    !value
  ){

    return;
  }


  let notes =
    [];


  try{

    notes =
      JSON.parse(
        localStorage.getItem(
          NOTE_KEY
        )
        ||
        "[]"
      );

  }catch{

    notes =
      [];
  }


  if(
    !Array.isArray(
      notes
    )
  ){

    notes =
      [];
  }


  notes.unshift({

    riiId:
      ROOT_ID,

    text:
      value,

    createdAt:
      new Date()
        .toISOString()
  });


  localStorage.setItem(

    NOTE_KEY,

    JSON.stringify(
      notes.slice(
        0,
        100
      )
    )
  );


  el(
    "notesResult"
  )
    .dataset
    .touched =
    "1";


  setText(

    "notesResult",

    text().saved
    +
    "\n"
    +
    value
  );


  speak(
    value
  );
};


/* =====================================================
   QUICK
===================================================== */

window.closeQuick =
function(){

  el(
    "quickOverlay"
  )
    .classList
    .remove(
      "open"
    );
};


window.quickOpen =
function(
  name
){

  closeQuick();


  openCenter(
    name
  );
};


/* =====================================================
   FLOATING RII
===================================================== */

const rii =
  el(
    "riiButton"
  );


let dragging =
  false;


let moved =
  false;


let offsetX =
  0;


let offsetY =
  0;


function clamp(
  value,
  min,
  max
){

  return Math.min(
    Math.max(
      value,
      min
    ),
    max
  );
}


rii.addEventListener(
  "pointerdown",
  event => {

    dragging =
      true;


    moved =
      false;


    const rect =
      rii
        .getBoundingClientRect();


    offsetX =
      event.clientX -
      rect.left;


    offsetY =
      event.clientY -
      rect.top;


    rii.setPointerCapture(
      event.pointerId
    );
  }
);


rii.addEventListener(
  "pointermove",
  event => {

    if(
      !dragging
    ){

      return;
    }


    moved =
      true;


    const size =
      rii.offsetWidth;


    rii.style.left =
      clamp(
        event.clientX -
        offsetX,
        6,
        innerWidth -
        size -
        6
      )
      +
      "px";


    rii.style.top =
      clamp(
        event.clientY -
        offsetY,
        8,
        innerHeight -
        size -
        12
      )
      +
      "px";
  }
);


rii.addEventListener(
  "pointerup",
  event => {

    dragging =
      false;


    try{

      rii.releasePointerCapture(
        event.pointerId
      );

    }catch{}


    if(
      !moved
    ){

      el(
        "quickOverlay"
      )
        .classList
        .add(
          "open"
        );
    }
  }
);


/* =====================================================
   OVERLAY
===================================================== */

[
  "languageOverlay",
  "quickOverlay"
]
.forEach(
  id => {

    el(
      id
    )
      .addEventListener(
        "click",
        event => {

          if(
            event.target.id ===
            id
          ){

            event
              .currentTarget
              .classList
              .remove(
                "open"
              );
          }
        }
      );
  }
);


/* =====================================================
   BOOT
===================================================== */

try{

  validateBoot();


  if(
    !localStorage.getItem(
      LANGUAGE_KEY
    )
  ){

    localStorage.setItem(
      LANGUAGE_KEY,
      "vi"
    );
  }


  render();


  console.log(
    "Rii AI V"
    +
    APP_VERSION
    +
    " Language Boot Fix ready"
  );


}catch(error){

  console.error(
    "Rii boot failed",
    error
  );


  showBootError(
    error
  );
}

})();
</script>
