<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>

<meta name="theme-color" content="#050b14">

<title>Rii AI V3.2 — Global Spiral Core</title>

<style>
:root{
  --bg:#050b14;
  --panel:rgba(10,22,37,.92);
  --line:rgba(192,150,66,.34);

  --gold:#d8ad58;
  --gold-light:#f2d58b;
  --mint:#58d9b0;

  --text:#f7f4ea;
  --muted:#99aabc;

  --shadow:
    0 18px 50px rgba(0,0,0,.34);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
}

/* =========================
   BACKGROUND
========================= */

.background{
  position:fixed;
  inset:0;
  z-index:-3;

  background:
    radial-gradient(
      circle at 80% 18%,
      rgba(210,165,74,.18),
      transparent 26%
    ),

    radial-gradient(
      circle at 15% 70%,
      rgba(27,92,155,.26),
      transparent 32%
    ),

    linear-gradient(
      145deg,
      #02070d,
      #071522 48%,
      #020811
    );
}

.background::before{
  content:"";
  position:absolute;
  inset:-28%;

  opacity:.28;

  background:
    repeating-radial-gradient(
      circle at 78% 22%,
      transparent 0 18px,
      rgba(210,164,72,.36) 20px 23px,
      transparent 25px 39px
    );

  transform:
    rotate(-8deg);
}

.background::after{
  content:"";
  position:absolute;
  inset:-24%;

  opacity:.20;

  background:
    repeating-radial-gradient(
      circle at 20% 75%,
      transparent 0 15px,
      rgba(35,107,174,.58) 17px 20px,
      transparent 22px 35px
    );

  transform:
    rotate(12deg);
}

/* =========================
   APP
========================= */

.app{
  width:min(100%,980px);
  min-height:100vh;
  margin:auto;

  padding:
    calc(18px + env(safe-area-inset-top))
    16px
    calc(120px + env(safe-area-inset-bottom));
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;

  margin-bottom:20px;
}

.logo{
  font-size:31px;
  font-weight:900;
  letter-spacing:-1px;
  color:var(--gold-light);
}

.logo span{
  color:white;
}

.tagline{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.round-btn{
  min-width:43px;
  height:43px;

  display:grid;
  place-items:center;

  border-radius:14px;
  border:1px solid var(--line);

  background:rgba(7,17,28,.84);
  color:white;

  font-size:19px;
}

.ready{
  display:flex;
  align-items:center;
  gap:6px;

  height:43px;

  padding:0 11px;

  border-radius:14px;
  border:1px solid var(--line);

  background:rgba(7,17,28,.84);

  color:var(--gold-light);

  font-size:11px;
  font-weight:800;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--mint);

  box-shadow:
    0 0 12px
    rgba(88,217,176,.7);
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  overflow:hidden;

  padding:24px;

  border-radius:31px;
  border:1px solid rgba(218,176,86,.38);

  background:
    linear-gradient(
      145deg,
      rgba(14,30,48,.96),
      rgba(5,14,24,.92)
    );

  box-shadow:var(--shadow);
}

.hero::after{
  content:"";

  position:absolute;
  width:270px;
  height:270px;

  right:-115px;
  top:-125px;

  border-radius:50%;

  border:
    23px solid
    rgba(215,171,80,.07);

  box-shadow:
    0 0 0 24px rgba(35,99,159,.06),
    0 0 0 48px rgba(215,171,80,.035);
}

.eyebrow{
  position:relative;
  z-index:2;

  color:var(--gold-light);

  font-size:12px;
  font-weight:850;
  letter-spacing:1px;

  margin-bottom:10px;
}

.hero h1{
  position:relative;
  z-index:2;

  margin:0;

  max-width:680px;

  font-size:
    clamp(31px,7vw,51px);

  line-height:1.04;
  letter-spacing:-1.6px;
}

.hero p{
  position:relative;
  z-index:2;

  max-width:620px;

  margin:
    15px 0 0;

  color:var(--muted);

  font-size:15px;
  line-height:1.6;
}

/* =========================
   IDENTITY
========================= */

.identity-bar{
  position:relative;
  z-index:2;

  margin-top:18px;
  padding:13px 14px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  border-radius:18px;
  border:1px solid rgba(255,255,255,.065);

  background:rgba(0,0,0,.22);
}

.identity-label{
  color:var(--muted);
  font-size:10px;
}

.identity-id{
  margin-top:4px;

  color:var(--gold-light);

  font-size:15px;
  font-weight:850;
}

.identity-type{
  margin-top:3px;

  color:#7d91a5;
  font-size:10px;
}

.robot-pill{
  flex:none;

  padding:8px 10px;

  border-radius:999px;

  background:rgba(255,255,255,.05);

  color:#7f91a4;

  font-size:10px;
}

/* =========================
   SECTION
========================= */

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;

  margin:
    24px 3px
    12px;
}

.section-head h2{
  margin:0;
  font-size:20px;
}

.section-head span{
  color:var(--muted);
  font-size:11px;
}

/* =========================
   CENTERS
========================= */

.center-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:11px;
}

.center-card{
  position:relative;
  overflow:hidden;

  min-height:188px;

  padding:17px;

  border-radius:25px;

  border:
    1px solid
    rgba(255,255,255,.08);

  cursor:pointer;

  box-shadow:
    0 12px 32px
    rgba(0,0,0,.24);
}

.center-card:active{
  transform:scale(.975);
}

.math{
  background:
    linear-gradient(
      145deg,
      #103b60,
      #071d32
    );

  border-color:
    rgba(65,159,214,.43);
}

.camera{
  background:
    linear-gradient(
      145deg,
      #64491c,
      #241a0b
    );

  border-color:
    rgba(226,180,81,.54);
}

.translate{
  background:
    linear-gradient(
      145deg,
      #075148,
      #06272a
    );

  border-color:
    rgba(62,207,174,.42);
}

.notes{
  background:
    linear-gradient(
      145deg,
      #493174,
      #211b42
    );

  border-color:
    rgba(141,103,215,.42);
}

.icon{
  width:55px;
  height:55px;

  display:grid;
  place-items:center;

  border-radius:17px;

  border:
    1px solid
    rgba(255,255,255,.1);

  background:
    rgba(0,0,0,.24);

  font-size:28px;
}

.center-card h3{
  margin:
    16px 0 7px;

  font-size:19px;
}

.center-card p{
  margin:0;

  max-width:210px;

  color:
    rgba(238,243,248,.70);

  font-size:12px;
  line-height:1.48;
}

.arrow{
  position:absolute;
  right:14px;
  bottom:14px;

  width:34px;
  height:34px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:
    rgba(0,0,0,.22);

  font-size:18px;
}

/* =========================
   RECENT
========================= */

.recent{
  margin-top:18px;
  padding:17px;

  border-radius:25px;
  border:1px solid rgba(255,255,255,.07);

  background:
    rgba(8,20,33,.84);
}

.recent-title{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:6px;
}

.recent-title strong{
  font-size:16px;
}

.recent-title span{
  color:var(--muted);
  font-size:10px;
}

.recent-item{
  display:flex;
  align-items:center;
  gap:11px;

  padding:11px 3px;

  border-bottom:
    1px solid
    rgba(255,255,255,.05);
}

.recent-item:last-child{
  border-bottom:0;
}

.recent-icon{
  width:40px;
  height:40px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:12px;

  background:
    rgba(255,255,255,.055);

  font-size:20px;
}

.recent-text{
  flex:1;
  min-width:0;
}

.recent-text strong{
  display:block;
  font-size:13px;
}

.recent-text span{
  display:block;

  margin-top:2px;

  color:var(--muted);
  font-size:11px;
}

.footer{
  margin-top:16px;

  text-align:center;

  color:#74879a;

  font-size:10px;
  line-height:1.5;
}

/* =========================
   FLOATING RII
========================= */

.rii{
  position:fixed;

  left:
    calc(100vw - 82px);

  top:
    calc(100vh - 148px);

  z-index:999;

  width:62px;
  height:62px;

  display:grid;
  place-items:center;

  border-radius:50%;

  border:
    2px solid
    var(--gold);

  background:
    radial-gradient(
      circle at 35% 30%,
      #28517c,
      #06121e 62%
    );

  color:var(--gold-light);

  font-size:18px;
  font-weight:900;

  box-shadow:
    0 9px 28px rgba(0,0,0,.55),
    0 0 0 5px rgba(10,23,38,.72),
    0 0 21px rgba(213,168,75,.22);

  touch-action:none;
  user-select:none;
}

/* =========================
   OVERLAYS
========================= */

.overlay{
  position:fixed;
  inset:0;

  z-index:900;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(1,6,11,.76);

  backdrop-filter:
    blur(16px);
}

.overlay.open{
  display:flex;
}

.panel{
  width:min(94vw,430px);

  max-height:86vh;
  overflow:auto;

  padding:21px;

  border-radius:30px;
  border:1px solid rgba(217,173,88,.38);

  background:
    linear-gradient(
      155deg,
      rgba(14,29,47,.99),
      rgba(4,12,21,.99)
    );

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.62);
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  margin-bottom:16px;
}

.panel-head h3{
  margin:0;
  font-size:21px;
}

.close{
  width:38px;
  height:38px;

  border:0;
  border-radius:50%;

  background:
    rgba(255,255,255,.07);

  color:white;

  font-size:18px;
}

/* =========================
   LANGUAGE
========================= */

.language-list{
  display:grid;
  gap:9px;
}

.language-btn{
  width:100%;

  display:flex;
  align-items:center;
  gap:12px;

  padding:13px 14px;

  border-radius:17px;
  border:1px solid rgba(255,255,255,.075);

  background:
    rgba(255,255,255,.04);

  color:white;

  text-align:left;
}

.language-btn.active{
  border-color:rgba(216,173,88,.65);

  background:
    rgba(216,173,88,.12);
}

.language-flag{
  width:34px;
  font-size:23px;
}

.language-name{
  flex:1;
}

.language-name strong{
  display:block;
  font-size:14px;
}

.language-name span{
  display:block;

  margin-top:2px;

  color:var(--muted);
  font-size:10px;
}

.check{
  color:var(--gold-light);
  font-weight:900;
}

/* =========================
   QUICK MENU
========================= */

.quick-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;
}

.quick{
  min-height:90px;

  border-radius:18px;
  border:1px solid rgba(255,255,255,.075);

  background:
    rgba(255,255,255,.045);

  color:white;

  padding:13px;

  text-align:left;
  font-weight:800;
}

.quick span{
  display:block;

  margin-bottom:7px;
  font-size:25px;
}

.quick.robot{
  opacity:.38;
}

.quick-small-row{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:9px;

  margin-top:10px;
}

.quick-small{
  border-radius:15px;
  border:1px solid rgba(255,255,255,.07);

  background:
    rgba(255,255,255,.035);

  color:var(--muted);

  padding:12px;

  font-weight:750;
}

/* =========================
   PLACEHOLDER
========================= */

.screen{
  position:fixed;
  inset:0;

  z-index:850;

  display:none;

  overflow:auto;

  background:
    linear-gradient(
      145deg,
      #030912,
      #071522
    );

  padding:
    calc(18px + env(safe-area-inset-top))
    16px
    calc(100px + env(safe-area-inset-bottom));
}

.screen.open{
  display:block;
}

.screen-inner{
  width:min(100%,720px);
  margin:auto;
}

.back{
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;

  background:
    rgba(255,255,255,.055);

  color:white;

  padding:10px 13px;

  font-weight:800;
}

.screen-card{
  margin-top:18px;
  padding:25px;

  border-radius:29px;
  border:1px solid var(--line);

  background:var(--panel);
}

.screen-icon{
  font-size:47px;
}

.screen-card h2{
  margin:
    15px 0
    9px;
}

.screen-card p{
  color:var(--muted);
  line-height:1.6;
}

.coming{
  margin-top:19px;

  color:var(--gold-light);

  font-weight:850;
}

/* =========================
   MOBILE
========================= */

@media(max-width:430px){

  .app{
    padding-left:13px;
    padding-right:13px;
  }

  .header-actions{
    gap:5px;
  }

  .ready{
    padding:0 8px;
  }

  .hero{
    padding:20px;
  }

  .identity-bar{
    align-items:flex-start;
  }

  .center-grid{
    gap:9px;
  }

  .center-card{
    min-height:182px;
    padding:15px;
  }

  .center-card h3{
    font-size:17px;
  }

  .center-card p{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="background"></div>


<div class="app">

<header class="header">

  <div>

    <div class="logo">
      Rii <span>AI</span>
    </div>

    <div
      id="tagline"
      class="tagline"
    ></div>

  </div>


  <div class="header-actions">

    <button
      class="round-btn"
      onclick="speakHome()"
      aria-label="Read"
    >
      🔊
    </button>


    <button
      class="round-btn"
      onclick="openLanguageMenu()"
      aria-label="Language"
    >
      🌐
    </button>


    <div class="ready">

      <span class="dot"></span>

      <span id="readyText">
        Ready
      </span>

    </div>

  </div>

</header>



<section class="hero">

  <div class="eyebrow">
    RII GLOBAL SPIRAL CORE
  </div>


  <h1 id="heroTitle"></h1>


  <p id="heroText"></p>


  <div class="identity-bar">

    <div>

      <div
        id="identityLabel"
        class="identity-label"
      ></div>

      <div class="identity-id">
        Rii00000001
      </div>

      <div
        id="identityType"
        class="identity-type"
      ></div>

    </div>


    <div
      id="robotState"
      class="robot-pill"
    ></div>

  </div>

</section>



<div class="section-head">

  <h2 id="centerTitle"></h2>

  <span id="centerHint"></span>

</div>



<section class="center-grid">

  <article
    class="center-card math"
    onclick="openCenter('math')"
  >

    <div class="icon">
      🧮
    </div>

    <h3 id="mathTitle"></h3>

    <p id="mathText"></p>

    <div class="arrow">
      ›
    </div>

  </article>



  <article
    class="center-card camera"
    onclick="openCenter('camera')"
  >

    <div class="icon">
      📷
    </div>

    <h3 id="cameraTitle"></h3>

    <p id="cameraText"></p>

    <div class="arrow">
      ›
    </div>

  </article>



  <article
    class="center-card translate"
    onclick="openCenter('translate')"
  >

    <div class="icon">
      🌍
    </div>

    <h3 id="translateTitle"></h3>

    <p id="translateText"></p>

    <div class="arrow">
      ›
    </div>

  </article>



  <article
    class="center-card notes"
    onclick="openCenter('notes')"
  >

    <div class="icon">
      📝
    </div>

    <h3 id="notesTitle"></h3>

    <p id="notesText"></p>

    <div class="arrow">
      ›
    </div>

  </article>

</section>



<section class="recent">

  <div class="recent-title">

    <strong id="recentTitle"></strong>

    <span>
      Brain History
    </span>

  </div>


  <div class="recent-item">

    <div class="recent-icon">
      🐴
    </div>

    <div class="recent-text">

      <strong id="recentExplore"></strong>

      <span id="recentHorse"></span>

    </div>

  </div>


  <div class="recent-item">

    <div class="recent-icon">
      🧮
    </div>

    <div class="recent-text">

      <strong id="recentMath"></strong>

      <span>
        24 + 13 = 37
      </span>

    </div>

  </div>


  <div class="recent-item">

    <div class="recent-icon">
      🔊
    </div>

    <div class="recent-text">

      <strong id="recentWord"></strong>

      <span>
        Brown horse
      </span>

    </div>

  </div>

</section>



<div
  id="footerText"
  class="footer"
></div>

</div>



<!-- FLOATING RII -->

<div
  id="riiButton"
  class="rii"
>
  Rii
</div>



<!-- LANGUAGE OVERLAY -->

<div
  id="languageOverlay"
  class="overlay"
>

  <div class="panel">

    <div class="panel-head">

      <h3 id="languageHeading">
        Language
      </h3>

      <button
        class="close"
        onclick="closeLanguageMenu()"
      >
        ×
      </button>

    </div>


    <div
      id="languageList"
      class="language-list"
    ></div>

  </div>

</div>



<!-- QUICK MENU -->

<div
  id="quickOverlay"
  class="overlay"
>

  <div class="panel">

    <div class="panel-head">

      <h3 id="quickHeading"></h3>

      <button
        class="close"
        onclick="closeQuickMenu()"
      >
        ×
      </button>

    </div>


    <div class="quick-grid">

      <button
        class="quick"
        onclick="quickOpen('math')"
      >
        <span>🧮</span>
        <b id="quickMath"></b>
      </button>


      <button
        class="quick"
        onclick="quickOpen('camera')"
      >
        <span>📷</span>
        <b id="quickCamera"></b>
      </button>


      <button
        class="quick"
        onclick="quickOpen('translate')"
      >
        <span>🌍</span>
        <b id="quickTranslate"></b>
      </button>


      <button
        class="quick"
        onclick="quickOpen('notes')"
      >
        <span>📝</span>
        <b id="quickNotes"></b>
      </button>


      <button
        class="quick"
        onclick="closeQuickMenu()"
      >
        <span>🏠</span>
        <b>Home</b>
      </button>


      <button
        class="quick robot"
        disabled
      >
        <span>🤖</span>
        <b>Robot</b>
      </button>

    </div>


    <div class="quick-small-row">

      <button
        class="quick-small"
        onclick="openLanguageFromQuick()"
      >
        🌐 Language
      </button>


      <button class="quick-small">
        ⚙️ Settings
      </button>

    </div>

  </div>

</div>



<!-- CENTER PLACEHOLDER -->

<div
  id="centerScreen"
  class="screen"
>

  <div class="screen-inner">

    <button
      id="backButton"
      class="back"
      onclick="closeCenter()"
    >
      ← Home
    </button>


    <div class="screen-card">

      <div
        id="screenIcon"
        class="screen-icon"
      ></div>

      <h2 id="screenTitle"></h2>

      <p id="screenText"></p>

      <div
        id="comingText"
        class="coming"
      ></div>

    </div>

  </div>

</div>



<script>
(function(){
"use strict";


const LANGUAGE_KEY =
  "rii-v3-ui-language";


const languages = [

  {
    code:"vi",
    locale:"vi-VN",

    text[code] ||

function getCurrentLanguage(){

  const code =

  return (
    languages.find(

    )
    ||
    languages[0]
  );
}

function renderLanguages(){

  const current =
    getCurrentLanguage();

  const container =
    document.getElementById(
      "languageList"
    );


  container.innerHTML =
    languages
      .map(
        item => {

          const active =
            item.code ===
            current.code;

          return `
            <button
              class="language-btn ${active ? "active" : ""}"
              onclick="selectLanguage('${item.code}')"
            >

              <div class="language-flag">
                ${item.flag}
              </div>

              <div class="language-name">

                <strong>
                  ${item.native}
                </strong>

                <span>
                  ${item.english}
                </span>

              </div>

              <div class="check">
                ${active ? "✓" : ""}
              </div>

            </button>
          `;
        }
      )
      .join("");
}


window.selectLanguage =
function(code){

  if(
    !languages.some(
      item =>
        item.code === code
    )
  ){
    return;
  }


  localStorage.setItem(
    LANGUAGE_KEY,
    code
  );


  renderUI();

  closeLanguageMenu();
};

window.speakHome =
function(){

  if(

      "SpeechSynthesisUtterance" in window

    alert(
      "Speech is not supported on this device."
    );

    return;
  }


  const t =
    getText();

  const lang =
    getCurrentLanguage();


  const speech =
    new SpeechSynthesisUtterance(
      t.heroTitle +
      ". " +
      t.mathTitle +
      ". " +
      t.cameraTitle +
      ". " +
      t.translateTitle +
      ". " +
      t.notesTitle
    );


  speech.lang =
    lang.locale;

  speech.rate =
    .9;


  speechSynthesis.cancel();

  speechSynthesis.speak(
    speech
  );
};

/* =========================
   FLOATING RII
========================= */

const rii =
  document.getElementById(
    "riiButton"
  );


let dragging =
  false;


let moved =
  false;


let offsetX =
  0;


let offsetY =
  0;


function clamp(
  value,
  min,
  max
){

  return Math.min(
    Math.max(
      value,
      min
    ),
    max
  );
}


rii.addEventListener(
  "pointerdown",
  event => {

    dragging =
      true;

    moved =
      false;


    const rect =
      rii.getBoundingClientRect();


    offsetX =
      event.clientX -
      rect.left;


    offsetY =
      event.clientY -
      rect.top;


    rii.setPointerCapture(
      event.pointerId
    );
  }
);


rii.addEventListener(
  "pointermove",
  event => {

    if(!dragging){
      return;
    }


    moved =
      true;


    const size =
      rii.offsetWidth;


    const x =
      clamp(
        event.clientX -
        offsetX,
        6,
        window.innerWidth -
        size -
        6
      );


    const y =
      clamp(
        event.clientY -
        offsetY,
        8,
        window.innerHeight -
        size -
        12
      );


    rii.style.left =
      x + "px";


    rii.style.top =
      y + "px";
  }
);


rii.addEventListener(
  "pointerup",
  event => {

    dragging =
      false;


    try{

      rii.releasePointerCapture(
        event.pointerId
      );

    }catch{}


    if(!moved){

      document
        .getElementById(
          "quickOverlay"
        )
        .classList
        .add(
          "open"
        );
    }
  }
);


rii.addEventListener(
  "pointercancel",
  () => {

    dragging =
      false;
  }
);
