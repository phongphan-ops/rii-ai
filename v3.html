<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020814">

<title>Rii AI V3.9.0</title>

<style>
:root{
  --bg:#020814;
  --panel:#061326;
  --gold:#f3c65e;
  --gold2:#fff0b3;
  --blue:#58b8ff;
  --text:#f7f3e9;
  --muted:#9badc0;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
  overscroll-behavior:none;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(100%,720px);
  margin:auto;
  min-height:100vh;
  background:#020814;
}

.home-art{
  position:relative;
  width:100%;
  line-height:0;
  background:#020814;
}

.home-art img{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
}

.hot{
  position:absolute;
  border:0;
  background:transparent;
  color:transparent;
  padding:0;
  margin:0;
  z-index:5;
  border-radius:20px;
}

.hot:active{
  background:rgba(255,221,130,.09);
  box-shadow:inset 0 0 0 1px rgba(255,221,130,.35);
}

/* ===== MODAL ===== */

.sheet{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.sheet.open{
  display:flex;
}

.panel{
  width:min(100%,720px);
  max-height:88vh;
  overflow:auto;
  margin:0 auto;
  background:
    radial-gradient(circle at 50% 0%,rgba(32,93,153,.18),transparent 38%),
    linear-gradient(180deg,#0a1d35,#03101f);
  border:1px solid rgba(243,198,94,.52);
  border-radius:28px 28px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:
    0 -20px 60px rgba(0,0,0,.5),
    inset 0 0 30px rgba(88,184,255,.06);
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.panel h2{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  color:#f6cf75;
  font-size:26px;
}

.close{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid rgba(243,198,94,.4);
  background:#07162a;
  color:#f6cf75;
  font-size:22px;
}

.field{
  display:grid;
  gap:7px;
  margin:12px 0;
}

label{
  font-size:13px;
  color:#c8d2de;
}

input,
textarea,
select{
  width:100%;
  border:1px solid rgba(96,157,219,.3);
  border-radius:16px;
  background:#04101f;
  color:white;
  padding:13px 14px;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid rgba(243,198,94,.55);
  border-radius:16px;
  background:linear-gradient(180deg,#1a3d68,#071a31);
  color:#ffe59c;
  padding:12px 16px;
  font-weight:700;
}

.btn.gold{
  background:linear-gradient(180deg,#ffe6a0,#d89b29);
  color:#211300;
  border-color:#ffe5a0;
}

.result{
  white-space:pre-wrap;
  line-height:1.55;
  border:1px solid rgba(243,198,94,.22);
  background:#03101d;
  border-radius:16px;
  padding:14px;
  min-height:58px;
  color:#edf3fa;
}

.status{
  font-size:12px;
  color:#8fa5bb;
  margin-top:7px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  opacity:0;
  z-index:99;

  background:#07182d;
  border:1px solid rgba(243,198,94,.5);
  color:#ffe59c;

  padding:10px 15px;
  border-radius:999px;

  transition:.2s;
  pointer-events:none;

  white-space:nowrap;
  max-width:90vw;
  overflow:hidden;
  text-overflow:ellipsis;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.note-item{
  padding:12px;
  border:1px solid rgba(100,155,213,.22);
  border-radius:15px;
  background:#04101d;
  margin:8px 0;
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.game-choice{
  flex:1;
  min-width:90px;
  text-align:center;
  border:1px solid rgba(243,198,94,.28);
  background:#06162a;
  color:#dce8f4;
  border-radius:18px;
  padding:14px 10px;
}

.game-choice.active{
  border-color:#f3c65e;
  color:#ffe59c;
  box-shadow:0 0 18px rgba(243,198,94,.16);
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:16px;
  background:#020914;
  margin-top:10px;
}

@media(max-width:390px){
  .panel{
    border-radius:24px 24px 0 0;
    padding-left:14px;
    padding-right:14px;
  }

  .panel h2{
    font-size:23px;
  }
}

<script src="./worker-client-v2.js"></script>

<script>
(() => {

  const $ = selector =>
    document.querySelector(selector);

  const $$ = selector =>
    [...document.querySelectorAll(selector)];


  const LANGS = {

    vi: "vi-VN",

    en: "en-US",

    zh: "zh-CN",

    ko: "ko-KR",

    ja: "ja-JP"

  };


  const STORE = {

    profile: "rii-v390-profile",

    notes: "rii-v390-notes",

    game: "rii-v390-game"

  };


  let profile =
    JSON.parse(
      localStorage.getItem(
        STORE.profile
      ) || "null"
    ) || {

      name: "Rii Kid",

      grade: 3,

      lang: "vi",

      xp: 0

    };


  let notes =
    JSON.parse(
      localStorage.getItem(
        STORE.notes
      ) || "[]"
    );


  let game = {

    mode: "math",

    answer: null

  };


  const worker = () =>
    window.RiiWorkerClientV2 || null;


  function toast(text) {

    const el =
      $("#toast");

    el.textContent =
      text;

    el.classList.add(
      "show"
    );

    clearTimeout(
      window.__riiToastTimer
    );

    window.__riiToastTimer =
      setTimeout(
        () => {

          el.classList.remove(
            "show"
          );

        },
        1800
      );

  }


  function openSheet(
    name
  ) {

    const sheet =
      $("#sheet-" + name);

    if (!sheet) return;

    sheet.classList.add(
      "open"
    );

  }


  function closeSheets() {

    $$(".sheet.open")
      .forEach(
        sheet =>
          sheet.classList.remove(
            "open"
          )
      );

  }


  $$("[data-open]")
    .forEach(
      button => {

        button.onclick =
          () =>
            openSheet(
              button.dataset.open
            );

      }
    );


  $$(".close")
    .forEach(
      button => {

        button.onclick =
          closeSheets;

      }
    );


  $$(".sheet")
    .forEach(
      sheet => {

        sheet.onclick =
          event => {

            if (
              event.target === sheet
            ) {

              closeSheets();

            }

          };

      }
    );


  function speak(
    text,
    lang = profile.lang
  ) {

    text =
      String(
        text || ""
      ).trim();

    if (!text) return;


    if (
      !(
        "speechSynthesis"
        in window
      )
    ) {

      toast(
        "Thiết bị chưa hỗ trợ đọc"
      );

      return;

    }


    speechSynthesis
      .cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      LANGS[lang]
      || "vi-VN";


    utterance.rate =
      0.95;


    speechSynthesis
      .speak(
        utterance
      );

  }


  function listen(
    callback
  ) {

    const SpeechRecognition =
      window.SpeechRecognition
      || window.webkitSpeechRecognition;


    if (
      !SpeechRecognition
    ) {

      toast(
        "Safari chưa hỗ trợ nhận giọng nói"
      );

      return;

    }


    const recognition =
      new SpeechRecognition();


    recognition.lang =
      LANGS[
        profile.lang
      ] || "vi-VN";


    recognition.interimResults =
      false;


    recognition.maxAlternatives =
      1;


    recognition.onresult =
      event => {

        const text =
          event
            .results[0][0]
            .transcript;

        callback(
          text
        );

      };


    recognition.onerror =
      () => {

        toast(
          "Không nghe rõ"
        );

      };


    recognition.start();

  }


  $("#voiceHot")
    .onclick =
    () => {

      listen(
        text => {

          const normalized =
            text.toLowerCase();


          if (
            normalized
              .includes(
                "toán"
              )
          ) {

            openSheet(
              "math"
            );

          }

          else if (
            normalized
              .includes(
                "dịch"
              )
          ) {

            openSheet(
              "translate"
            );

          }

          else if (
            normalized
              .includes(
                "camera"
              )
            ||
            normalized
              .includes(
                "nhìn"
              )
          ) {

            openSheet(
              "vision"
            );

          }

          else if (
            normalized
              .includes(
                "ghi chú"
              )
            ||
            normalized
              .includes(
                "nhắc"
              )
          ) {

            openSheet(
              "notes"
            );

          }

          else {

            toast(
              "Rii nghe: "
              + text
            );

          }

        }
      );

    };


  /* ===================== */
  /* MATH */
  /* ===================== */

  $("#mathSolve")
    .onclick =
    async () => {

      const question =
        $("#mathInput")
          .value
          .trim();


      if (
        !question
      ) {

        toast(
          "Nhập bài toán"
        );

        return;

      }


      const client =
        worker();


      $("#mathStatus")
        .textContent =
        "Rii đang suy nghĩ...";


      try {

        if (
          !client
          ||
          !client.solveMath
        ) {

          throw new Error(
            "Worker chưa sẵn sàng"
          );

        }


        const response =
          await client
            .solveMath(
              question,
              profile.lang
            );


        const answer =
          response?.answer
          ||
          response?.result
          ||
          response?.text
          ||
          JSON.stringify(
            response
          );


        $("#mathResult")
          .textContent =
          answer;


        $("#mathStatus")
          .textContent =
          "Hoàn tất";


      }

      catch (
        error
      ) {

        $("#mathStatus")
          .textContent =
          "Lỗi: "
          + error.message;

      }

    };


  $("#mathSpeak")
    .onclick =
    () => {

      speak(
        $("#mathResult")
          .textContent
      );

    };


  /* ===================== */
  /* TRANSLATION */
  /* ===================== */

  $("#transGo")
    .onclick =
    async () => {

      const text =
        $("#transInput")
          .value
          .trim();


      const target =
        $("#transTarget")
          .value;


      if (
        !text
      ) {

        toast(
          "Nhập nội dung cần dịch"
        );

        return;

      }


      const client =
        worker();


      $("#transStatus")
        .textContent =
        "Đang dịch...";


      try {

        if (
          !client
          ||
          !client.translateText
        ) {

          throw new Error(
            "Worker chưa sẵn sàng"
          );

        }


        const response =
          await client
            .translateText(
              text,
              target
            );


        const output =
          response?.translation
          ||
          response?.result
          ||
          response?.text
          ||
          JSON.stringify(
            response
          );


        $("#transResult")
          .textContent =
          output;


        $("#transStatus")
          .textContent =
          "Hoàn tất";

      }

      catch (
        error
      ) {

        $("#transStatus")
          .textContent =
          "Lỗi: "
          + error.message;

      }

    };


  $("#transSpeak")
    .onclick =
    () => {

      speak(

        $("#transResult")
          .textContent,

        $("#transTarget")
          .value

      );

    };


  /* ===================== */
  /* VISION */
  /* ===================== */

  let visionData = "";


  $("#visionFile")
    .onchange =
    event => {

      const file =
        event
          .target
          .files?.[0];


      if (
        !file
      ) {

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        () => {

          visionData =
            reader.result;


          $("#visionPreview")
            .src =
            visionData;


          $("#visionPreview")
            .hidden =
            false;

        };


      reader
        .readAsDataURL(
          file
        );

    };


  $("#visionAnalyze")
    .onclick =
    async () => {

      if (
        !visionData
      ) {

        toast(
          "Chọn ảnh trước"
        );

        return;

      }


      const client =
        worker();


      $("#visionStatus")
        .textContent =
        "Rii đang quan sát...";


      try {

        if (
          !client
          ||
          !client.analyzeImage
        ) {

          throw new Error(
            "Worker chưa sẵn sàng"
          );

        }


        const response =
          await client
            .analyzeImage(
              visionData,
              profile.lang
            );


        const output =
          response?.answer
          ||
          response?.result
          ||
          response?.description
          ||
          response?.text
          ||
          JSON.stringify(
            response
          );


        $("#visionResult")
          .textContent =
          output;


        $("#visionStatus")
          .textContent =
          "Hoàn tất";

      }

      catch (
        error
      ) {

        $("#visionStatus")
          .textContent =
          "Lỗi: "
          + error.message;

      }

    };


  $("#visionSpeak")
    .onclick =
    () => {

      speak(
        $("#visionResult")
          .textContent
      );

    };


  /* ===================== */
  /* NOTES */
  /* ===================== */

  function escapeHTML(
    text
  ) {

    return String(
      text
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      );

  }


  function renderNotes() {

    const list =
      $("#noteList");


    if (
      !notes.length
    ) {

      list.innerHTML =
        `
        <div class="status">
          Chưa có ghi chú.
        </div>
        `;

      return;

    }


    list.innerHTML =
      notes
        .map(
          (
            note,
            index
          ) => {

            return `
              <div class="note-item">

                <b>
                  ${escapeHTML(
                    note.text
                  )}
                </b>

                <br>

                <small>
                  ${
                    note.time
                    ||
                    "Không đặt giờ"
                  }
                </small>

                <button
                  class="btn"
                  data-delete-note="${index}"
                  style="
                    float:right;
                    padding:5px 9px;
                  "
                >
                  Xóa
                </button>

              </div>
            `;

          }
        )
        .join("");


    $$(
      "[data-delete-note]"
    )
      .forEach(
        button => {

          button.onclick =
            () => {

              const index =
                Number(
                  button.dataset
                    .deleteNote
                );


              notes.splice(
                index,
                1
              );


              localStorage
                .setItem(
                  STORE.notes,
                  JSON.stringify(
                    notes
                  )
                );


              renderNotes();

            };

        }
      );

  }


  $("#saveNote")
    .onclick =
    () => {

      const text =
        $("#noteText")
          .value
          .trim();


      const time =
        $("#noteTime")
          .value;


      if (
        !text
      ) {

        toast(
          "Nhập ghi chú"
        );

        return;

      }


      notes.unshift(
        {

          text,

          time

        }
      );


      localStorage
        .setItem(
          STORE.notes,
          JSON.stringify(
            notes
          )
        );


      $("#noteText")
        .value =
        "";


      renderNotes();


      toast(
        "Đã lưu"
      );

    };


  renderNotes();


  /* ===================== */
  /* GAME */
  /* ===================== */

  function setGame(
    mode
  ) {

    game.mode =
      mode;


    $$(".game-choice")
      .forEach(
        button => {

          button.classList
            .toggle(
              "active",
              button.dataset.mode
              === mode
            );

        }
      );


    openSheet(
      "game"
    );


    newQuestion();

  }


  $$("[data-game]")
    .forEach(
      button => {

        button.onclick =
          () => {

            setGame(
              button.dataset.game
            );

          };

      }
    );


  $$(".game-choice")
    .forEach(
      button => {

        button.onclick =
          () => {

            game.mode =
              button.dataset.mode;


            $$(".game-choice")
              .forEach(
                item => {

                  item.classList
                    .toggle(
                      "active",
                      item === button
                    );

                }
              );


            newQuestion();

          };

      }
    );


  $("#startGameHot")
    .onclick =
    () => {

      setGame(
        game.mode
      );

    };


  function newQuestion() {

    let question = "";


    if (
      game.mode
      === "math"
    ) {

      const a =
        2
        +
        Math.floor(
          Math.random()
          * 20
        );


      const b =
        2
        +
        Math.floor(
          Math.random()
          * 20
        );


      game.answer =
        String(
          a + b
        );


      question =
        `${a} + ${b} = ?`;

    }


    else if (
      game.mode
      === "language"
    ) {

      const bank = [

        [
          "hello",
          "xin chào"
        ],

        [
          "book",
          "quyển sách"
        ],

        [
          "water",
          "nước"
        ],

        [
          "cat",
          "con mèo"
        ]

      ];


      const pair =
        bank[
          Math.floor(
            Math.random()
            * bank.length
          )
        ];


      game.answer =
        pair[1]
          .toLowerCase();


      question =
        `Dịch sang tiếng Việt: “${pair[0]}”`;

    }


    else {

      game.answer =
        "camera";


      question =
        "Mở Camera AI và tìm một vật thể quanh con. Sau đó nhập từ “camera” để hoàn thành thử thách.";

    }


    $("#gameQuestion")
      .textContent =
      question;


    $("#gameAnswer")
      .value =
      "";


    $("#gameStatus")
      .textContent =
      "";

  }


  $("#newQuestion")
    .onclick =
    newQuestion;


  $("#checkAnswer")
    .onclick =
    () => {

      const answer =
        $("#gameAnswer")
          .value
          .trim()
          .toLowerCase();


      if (
        !answer
      ) {

        toast(
          "Nhập đáp án"
        );

        return;

      }


      if (
        answer
        ===
        String(
          game.answer
        )
          .toLowerCase()
      ) {

        profile.xp =
          (
            profile.xp
            || 0
          )
          + 20;


        localStorage
          .setItem(
            STORE.profile,
            JSON.stringify(
              profile
            )
          );


        $("#gameStatus")
          .textContent =
          "Chính xác! +20 XP";


        speak(
          "Chính xác!"
        );

      }

      else {

        $("#gameStatus")
          .textContent =
          "Chưa đúng, thử lại nhé.";

      }

    };


  /* ===================== */
  /* LEADERBOARD */
  /* ===================== */

  $$("[data-rank]")
    .forEach(
      button => {

        button.onclick =
          () => {

            const type =
              button.dataset.rank;


            const label = {

              overall:
                "Tổng",

              math:
                "Toán",

              language:
                "Phiên dịch",

              vision:
                "Camera"

            }[type]
            || type;


            toast(
              "Bảng xếp hạng: "
              + label
            );

          };

      }
    );


  /* ===================== */
  /* HOME */
  /* ===================== */

  $("#navHome")
    .onclick =
    () => {

      window.scrollTo(
        {

          top:0,

          behavior:"smooth"

        }
      );

    };


  /* ===================== */
  /* PROFILE */
  /* ===================== */

  function fillProfile() {

    $("#profileName")
      .value =
      profile.name
      || "Rii Kid";


    $("#profileGrade")
      .value =
      String(
        profile.grade
        || 3
      );


    $("#appLang")
      .value =
      profile.lang
      || "vi";

  }


  fillProfile();


  $("#saveProfile")
    .onclick =
    () => {

      profile.name =
        $("#profileName")
          .value
          .trim()
        ||
        "Rii Kid";


      profile.grade =
        Number(
          $("#profileGrade")
            .value
        )
        || 3;


      profile.lang =
        $("#appLang")
          .value
        || "vi";


      localStorage
        .setItem(
          STORE.profile,
          JSON.stringify(
            profile
          )
        );


      toast(
        "Đã lưu hồ sơ"
      );


      closeSheets();

    };

})();
</script>

</body>
</html>
