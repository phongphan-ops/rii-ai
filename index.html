<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Robot Learning</title>

  <style>
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      margin:0;
      background:#070b10;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    .app{
      max-width:480px;
      margin:auto;
      min-height:100vh;
      padding:24px 18px 110px;
    }

    .robot-card,
    .card{
      background:#111823;
      border:1px solid #253041;
      border-radius:24px;
      padding:20px;
      margin-bottom:16px;
    }

    .robot-top{
      display:flex;
      gap:15px;
      align-items:center;
    }

    .robot-icon{
      width:72px;
      height:72px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#162333;
      font-size:40px;
    }

    .robot-name{
      font-size:26px;
      font-weight:800;
    }

    .robot-id{
      color:#8794a6;
      margin-top:4px;
    }

    .status{
      color:#54dfaa;
      margin-top:8px;
      font-size:14px;
    }

    .section-title{
      font-size:21px;
      font-weight:800;
      margin:22px 0 12px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .stat{
      background:#0d141d;
      border:1px solid #222d3b;
      border-radius:18px;
      padding:16px;
    }

    .label{
      font-size:13px;
      color:#8592a3;
    }

    .value{
      font-size:25px;
      font-weight:800;
      margin-top:6px;
    }

    button{
      width:100%;
      border:0;
      border-radius:18px;
      padding:17px;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
    }

    .primary{
      background:#4be0a8;
      color:#07100c;
    }

    .answer{
      background:#16202c;
      color:white;
      margin-top:10px;
      border:1px solid #2b3747;
    }

    .answer:active{
      transform:scale(.98);
    }

    .question-object{
      font-size:90px;
      text-align:center;
      margin:20px 0;
    }

    .question-title{
      text-align:center;
      font-size:22px;
      font-weight:800;
    }

    .hidden{
      display:none;
    }

    .brain-item{
      background:#0e151e;
      border:1px solid #222d3a;
      border-radius:18px;
      padding:15px;
      margin-bottom:10px;
    }

    .brain-name{
      font-weight:800;
      font-size:17px;
    }

    .brain-meta{
      color:#8794a5;
      font-size:13px;
      margin-top:6px;
    }

    .bar{
      height:8px;
      background:#26313e;
      border-radius:8px;
      overflow:hidden;
      margin-top:10px;
    }

    .bar-fill{
      height:100%;
      background:linear-gradient(90deg,#4be0a8,#5a8cff);
    }

    .memory{
      background:#0e151e;
      border:1px solid #222d3a;
      border-radius:18px;
      padding:14px;
      margin-bottom:10px;
    }

    .memory small{
      color:#7f8b9b;
    }

    .message{
      text-align:center;
      margin-top:14px;
      min-height:25px;
      font-weight:700;
    }

    .bottom-nav{
      position:fixed;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:min(100%,480px);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      background:rgba(7,11,16,.95);
      backdrop-filter:blur(15px);
      border-top:1px solid #222a35;
      padding:12px 5px calc(12px + env(safe-area-inset-bottom));
    }

    .nav{
      text-align:center;
      font-size:12px;
      color:#768396;
    }

    .nav.active{
      color:#4be0a8;
    }

    .nav-icon{
      font-size:22px;
    }
  </style>
</head>

<body>

<div class="app">

  <div id="homePage">

    <div class="robot-card">
      <div class="robot-top">

        <div class="robot-icon">🤖</div>

        <div>
          <div class="robot-name">Mimo</div>
          <div class="robot-id">RB-000001</div>
          <div class="status">● Đang hoạt động</div>
        </div>

      </div>

      <div class="section-title">Trạng thái phát triển</div>

      <div class="grid">

        <div class="stat">
          <div class="label">Kinh nghiệm</div>
          <div class="value" id="xp">0</div>
        </div>

        <div class="stat">
          <div class="label">Đồ vật đã biết</div>
          <div class="value" id="knownObjects">0</div>
        </div>

        <div class="stat">
          <div class="label">Tổng lần học</div>
          <div class="value" id="totalLessons">0</div>
        </div>

        <div class="stat">
          <div class="label">Ký ức</div>
          <div class="value" id="memoryCount">0</div>
        </div>

      </div>
    </div>

    <button class="primary" onclick="openLearn()">
      🎮 Bắt đầu học
    </button>

    <div class="section-title">🧠 Bộ nhớ gần đây</div>
    <div id="memoryList"></div>

  </div>


  <div id="learnPage" class="hidden">

    <div class="card">

      <div class="question-title">
        Đây là đồ vật gì?
      </div>

      <div class="question-object" id="objectEmoji">
        🪑
      </div>

      <div id="answers"></div>

      <div class="message" id="message"></div>

    </div>

    <button class="primary" onclick="backHome()">
      ← Về trang chính
    </button>

  </div>


  <div id="brainPage" class="hidden">

    <div class="section-title">
      🧠 Kiến thức đã học
    </div>

    <div id="brainList"></div>

  </div>

</div>


<div class="bottom-nav">

  <div class="nav active" onclick="showPage('home')">
    <div class="nav-icon">⌂</div>
    Home
  </div>

  <div class="nav" onclick="showPage('learn')">
    <div class="nav-icon">🎮</div>
    Learn
  </div>

  <div class="nav" onclick="showPage('brain')">
    <div class="nav-icon">🧠</div>
    Brain
  </div>

  <div class="nav">
    <div class="nav-icon">🤖</div>
    Robot
  </div>

</div>


<script>

const objectDatabase = [

  {
    id:"chair",
    name:"Ghế",
    emoji:"🪑",
    answers:["Ghế","Bàn","Chai nước","Cửa"]
  },

  {
    id:"bottle",
    name:"Chai nước",
    emoji:"🧴",
    answers:["Điện thoại","Chai nước","Ghế","Giày"]
  },

  {
    id:"door",
    name:"Cửa",
    emoji:"🚪",
    answers:["Bàn","Cửa","Chai nước","Ghế"]
  },

  {
    id:"phone",
    name:"Điện thoại",
    emoji:"📱",
    answers:["Điện thoại","Cửa","Giày","Bàn"]
  },

  {
    id:"shoe",
    name:"Giày",
    emoji:"👟",
    answers:["Ghế","Điện thoại","Giày","Cửa"]
  }

];


const defaultRobot = {

  xp:0,

  totalLessons:0,

  objects:{},

  memories:[]

};


let robot =
JSON.parse(localStorage.getItem("robotLearningV2"))
|| defaultRobot;


let currentObject = null;


function save(){

  localStorage.setItem(
    "robotLearningV2",
    JSON.stringify(robot)
  );

}


function updateHome(){

  document.getElementById("xp").innerText =
    robot.xp + " XP";

  document.getElementById("totalLessons").innerText =
    robot.totalLessons;

  document.getElementById("memoryCount").innerText =
    robot.memories.length;


  let known = 0;

  Object.values(robot.objects).forEach(obj => {

    if(obj.confidence >= 80){
      known++;
    }

  });

  document.getElementById("knownObjects").innerText =
    known;


  renderMemories();
  renderBrain();

}


function openLearn(){

  showPage("learn");

  nextQuestion();

}


function nextQuestion(){

  currentObject =
    objectDatabase[
      Math.floor(
        Math.random() * objectDatabase.length
      )
    ];


  document.getElementById("objectEmoji").innerText =
    currentObject.emoji;


  document.getElementById("message").innerText = "";


  const answers =
    [...currentObject.answers]
    .sort(() => Math.random() - 0.5);


  const box =
    document.getElementById("answers");

  box.innerHTML = "";


  answers.forEach(answer => {

    const btn =
      document.createElement("button");

    btn.className =
      "answer";

    btn.innerText =
      answer;

    btn.onclick =
      () => checkAnswer(answer);

    box.appendChild(btn);

  });

}


function checkAnswer(answer){

  const correct =
    answer === currentObject.name;


  robot.totalLessons++;


  if(!robot.objects[currentObject.id]){

    robot.objects[currentObject.id] = {

      name:currentObject.name,

      emoji:currentObject.emoji,

      confidence:0,

      correct:0,

      wrong:0

    };

  }


  const obj =
    robot.objects[currentObject.id];


  if(correct){

    obj.correct++;

    obj.confidence =
      Math.min(
        100,
        obj.confidence + 20
      );

    robot.xp += 10;


    addMemory(
      "Nhận biết đúng " +
      currentObject.name
    );


    document.getElementById("message").innerText =
      "✅ Chính xác! Robot đã học thêm về " +
      currentObject.name;

  }

  else{

    obj.wrong++;

    obj.confidence =
      Math.max(
        0,
        obj.confidence - 5
      );


    addMemory(
      "Nhận biết sai " +
      currentObject.name
    );


    document.getElementById("message").innerText =
      "❌ Chưa đúng. Đây là " +
      currentObject.name;

  }


  save();

  updateHome();


  setTimeout(
    nextQuestion,
    1200
  );

}


function addMemory(text){

  robot.memories.unshift({

    text:text,

    time:new Date().toLocaleString("vi-VN")

  });


  if(robot.memories.length > 100){

    robot.memories.pop();

  }

}


function renderMemories(){

  const list =
    document.getElementById("memoryList");


  if(robot.memories.length === 0){

    list.innerHTML = `

      <div class="memory">

        Robot chưa có ký ức học tập.

      </div>

    `;

    return;

  }


  list.innerHTML = "";


  robot.memories
  .slice(0,6)
  .forEach(memory => {

    list.innerHTML += `

      <div class="memory">

        ${memory.text}

        <br>

        <small>
          ${memory.time}
        </small>

      </div>

    `;

  });

}


function renderBrain(){

  const list =
    document.getElementById("brainList");


  const objects =
    Object.values(robot.objects);


  if(objects.length === 0){

    list.innerHTML = `

      <div class="brain-item">

        Robot chưa học đồ vật nào.

      </div>

    `;

    return;

  }


  list.innerHTML = "";


  objects.forEach(obj => {

    let state =
      "Đang học";


    if(obj.confidence >= 80){

      state =
        "Đã nhận biết";

    }


    list.innerHTML += `

      <div class="brain-item">

        <div class="brain-name">

          ${obj.emoji}
          ${obj.name}

        </div>

        <div class="brain-meta">

          ${state}
          • Đúng ${obj.correct}
          • Sai ${obj.wrong}

        </div>

        <div class="bar">

          <div
            class="bar-fill"
            style="width:${obj.confidence}%">
          </div>

        </div>

        <div class="brain-meta">

          Độ nhận biết:
          ${obj.confidence}%

        </div>

      </div>

    `;

  });

}


function showPage(page){

  document.getElementById("homePage")
    .classList.add("hidden");

  document.getElementById("learnPage")
    .classList.add("hidden");

  document.getElementById("brainPage")
    .classList.add("hidden");


  if(page === "home"){

    document.getElementById("homePage")
      .classList.remove("hidden");

  }


  if(page === "learn"){

    document.getElementById("learnPage")
      .classList.remove("hidden");

    nextQuestion();

  }


  if(page === "brain"){

    document.getElementById("brainPage")
      .classList.remove("hidden");

    renderBrain();

  }


  const navs =
    document.querySelectorAll(".nav");


  navs.forEach(
    n => n.classList.remove("active")
  );


  if(page === "home"){
    navs[0].classList.add("active");
  }

  if(page === "learn"){
    navs[1].classList.add("active");
  }

  if(page === "brain"){
    navs[2].classList.add("active");
  }

}


function backHome(){

  showPage("home");

}


updateHome();

</script>

</body>
</html>
